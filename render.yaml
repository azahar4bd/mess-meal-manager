# ═══════════════════════════════════════════════════════════════════════════
#  Mess Meal Manager — Render Blueprint
#  ─────────────────────────────────────────────────────────────────────────
#  Render ড্যাশবোর্ডে  New +  →  Blueprint  →  এই রিপোটি সিলেক্ট করলেই
#  নিচের সবকিছু নিজে থেকে তৈরি হয়ে যাবে:
#    • একটি Render PostgreSQL ডেটাবেস
#    • একটি Next.js ওয়েব সার্ভিস (প্রতি `main` পুশে auto-deploy)
#  প্রতি ডিপ্লয়ের আগে preDeployCommand দিয়ে DB migration নিজে থেকে চলবে।
#
#  ডকুমেন্ট: docs/RENDER-DEPLOY.md
# ═══════════════════════════════════════════════════════════════════════════

databases:
  - name: mess-meal-db
    # ⚠️  `free` ডেটাবেস তৈরির ৩০ দিন পর মেয়াদ শেষ হয়ে যায় (তারপর ১৪ দিন
    #     গ্রেস পিরিয়ড, তারপর ডেটা মুছে যায়)। স্থায়ী প্রোডাকশনের জন্য
    #     `0.1c-256mb` (~$৭/মাস) ব্যবহার করুন, অথবা স্থায়ী ফ্রি Neon DB
    #     (গাইড দেখুন)।
    plan: free
    region: singapore          # বাংলাদেশের সবচেয়ে কাছের অঞ্চল
    postgresMajorVersion: "17"
    databaseName: mess_manager

services:
  - type: web
    name: mess-meal-manager
    runtime: node
    plan: free                 # ফ্রি সার্ভিস ১৫ মিনিট ইনঅ্যাকটিভ হলে ঘুমিয়ে যায়;
                               # সবসময় চালু রাখতে `0.5c-512mb` (~$৭/মাস) দিন
    region: singapore
    branch: main
    autoDeployTrigger: commit  # main-এ প্রতি push-এ অটো ডিপ্লয়

    # --include=dev দিয়ে devDependencies (typescript, tailwind, tsx) রাখা হয়,
    # যা build এবং pre-deploy migration-এর জন্য লাগে।
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build

    # প্রতি ডিপ্লয়ের আগে সব pending migration নিজে থেকে চলবে (idempotent)।
    preDeployCommand: npm run db:migrate:remote

    # package.json-এ start স্ক্রিপ্ট Render-এর $PORT ব্যবহার করে
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      # Render-এর ভেতরের (private) connection string — SSL ছাড়াই কাজ করে,
      # বাইরে থেকে এক্সপোজড নয়।
      - key: DATABASE_URL
        fromDatabase:
          name: mess-meal-db
          property: connectionString

      - key: DB_DRIVER
        value: pg               # node-postgres TCP pool (Render Postgres)
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION       # Next.js 16-এর জন্য Node 20.9+ / 22 লাগে
        value: 22.14.0
      - key: PG_POOL_MAX
        value: "10"

      # সেশন সাইন করার সিক্রেট — Render একবারই র‍্যান্ডম ভ্যালু বানাবে,
      # পরের ডিপ্লয়েগুলোতেও একই থাকবে (সেশন মুছে যাবে না)।
      - key: SESSION_SECRET
        generateValue: true

      - key: AUTO_SYNC
        value: "0"
      - key: SHOW_PASSWORDS_IN_ADMIN
        value: "0"

      # ── ঐচ্ছিক (খালি রাখলেও অ্যাপ চলবে; Blueprint apply করার সময়
      #    Render ড্যাশবোর্ডে চাইলে ভ্যালু দিতে পারবেন) ──

      # Google Sheets সিঙ্ক চালু করতে Apps Script Web App-এর /exec URL দিন
      - key: GOOGLE_SCRIPT_WEB_APP_URL
        sync: false
